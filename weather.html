<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather</title>
    <link rel="stylesheet" href="weather.css">
</head>
<body>
    <main>
        <header>
            <h1>Weather API</h1>
            <form id="form">
                <input type="text" placeholder="City" id="search">
                <button type="submit">Search</button>
            </form>
        </header>
        <section>
            <div id="location">
                <h1 id="city">Vientiane</h1>
                <h3 id="state">LA</h3>
            </div>
            
            <div id="card">
                <div id="weather">
                    <h1>35</h1>
                    <small>max: 37, min: 21</small>
                </div>
                <div id="info">
                    <div id="status">Hot</div>
                    <div id="humidity">100</div>
                    <div id="wind">4.0</div>
                </div>
            </div>
        </section>
    </main>

    <script src="config.js"></script>
    <script src="weather.js"></script>
</body>
</html>
